services:
  - type: web
    name: snickylink-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snickylink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: snickylink-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
  - type: keyvalue
    name: snickylink-redis
    plan: free
    ipAllowList: []
databases:
  - name: snickylink-db
    plan: free
